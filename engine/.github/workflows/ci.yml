name: CI - Build, Test & Code Analysis

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ─── Java (Maven) ──────────────────────────────────────────────
  java-build-and-test:
    name: Java - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        run: mvn -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: target/surefire-reports/

  java-code-analysis:
    name: Java - Code Analysis
    runs-on: ubuntu-latest
    needs: java-build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs analysis
        run: |
          mvn -B clean compile
          mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.3.1:check \
            -Dspotbugs.excludeFilterFile=spotbugs-exclude.xml

      - name: Run Checkstyle
        run: |
          mvn -B checkstyle:check \
            -Dcheckstyle.config.location=sun_checks.xml \
            -Dcheckstyle.violationSeverity=warning \
            -Dcheckstyle.maxAllowedViolations=4763  # baseline 2026-10-08: ratchet down, never up

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/checkstyle-result.xml

  # ─── .NET (C#) ─────────────────────────────────────────────────
  dotnet-build-and-test:
    name: .NET - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj

      - name: Build
        run: dotnet build src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore src/test/dotnet/DotNetAnalyzer.Tests/DotNetAnalyzer.Tests.csproj

      - name: Run tests
        run: |
          dotnet test src/test/dotnet/DotNetAnalyzer.Tests/DotNetAnalyzer.Tests.csproj \
            --no-restore \
            --filter "Category!=Corpus" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./dotnet-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet-test-results/

  dotnet-code-analysis:
    name: .NET - Code Analysis
    runs-on: ubuntu-latest
    needs: dotnet-build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install analysis tools
        run: |
          dotnet tool install --global security-scan

      - name: Run dotnet format check
        run: |
          dotnet format src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            --verify-no-changes --verbosity diagnostic

      - name: Run security scan (report-only, SARIF uploaded)
        run: |
          security-scan src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            --export=dotnet-security-report.sarif || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-analysis-reports
          path: dotnet-security-report.sarif

  # ─── Output contract (005-json-schema-contract) ─────────────────
  schema-check:
    name: Contract - schema-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: schema/package-lock.json

      - name: Verify Java, .NET and generated types against the contract
        run: make schema-check

      - name: BDD scenarios of 005 (incl. end-to-end schema-check divergences)
        env:
          SCHEMA_CHECK_E2E: 'true'
        run: mvn -B test -Dtest=RunSchemaContractFeaturesTest

      - name: Upload schema-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-check-logs
          path: |
            target/schema-check/*.log
            target/cucumber-reports/

  # ─── Release distribution (main-merge or tag) ──────────────────
  release:
    name: Build & Publish Distribution (${{ matrix.rid }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [java-build-and-test, dotnet-build-and-test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
            ext: ''
          - rid: osx-arm64
            archive: tar.gz
            ext: ''
          - rid: osx-x64
            archive: tar.gz
            ext: ''
          - rid: win-x64
            archive: zip
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=false
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            PRERELEASE=true
          fi
          DIST_NAME="static-inference-${TAG}-${{ matrix.rid }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "dist_name=${DIST_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DIST_NAME=${DIST_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Java fat jar
        run: mvn -B -DskipTests clean package

      - name: Stage distribution layout
        run: |
          mkdir -p "dist/${DIST_NAME}/bin"
          cp target/java-dependency-extractor.jar "dist/${DIST_NAME}/bin/"

      # Framework-dependent: a single-file bundle cannot load MSBuild and always
      # degrades to roslyn-fallback (BUG-005).
      - name: Publish .NET analyzer (framework-dependent)
        run: |
          dotnet publish src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "dist/${DIST_NAME}/bin"
          echo "--- bin contents ---"
          ls -la "dist/${DIST_NAME}/bin"

      - name: Generate README.md
        run: |
          BIN_DOTNET="bin/dotnet-analyzer${{ matrix.ext }}"
          cat > "dist/${DIST_NAME}/README.md" <<EOF
          # static-inference ${RELEASE_TAG}

          Static-analysis toolkit that infers microservice dependencies from Java
          and .NET source code. Build target: \`${{ matrix.rid }}\`.

          ## Contents

          - \`bin/java-dependency-extractor.jar\` — Java analyzer (Spoon-based fat jar)
          - \`${BIN_DOTNET}\` — .NET analyzer (framework-dependent; launcher + assemblies in \`bin/\`)

          ## Requirements

          - Java analyzer: **JRE/JDK 17+**
          - .NET analyzer: **.NET 8 runtime**. Install the **.NET 8 SDK** for full
            project loading via MSBuild; with only the runtime the analyzer falls
            back to direct source parsing (\`meta.source = roslyn-fallback\`).

          ## Usage

          ### Analyze a Java project

          \`\`\`bash
          java -jar bin/java-dependency-extractor.jar <project-path> <output-file>
          \`\`\`

          Example:

          \`\`\`bash
          java -jar bin/java-dependency-extractor.jar ./my-spring-app graph.json
          \`\`\`

          Generated files:
          - \`graph.json\` — full dependency graph
          - \`graph_architecture.json\` — proposed microservice split
          - \`output_web.json\` — web components (when detected)

          ### Analyze a .NET project

          The .NET analyzer writes the dependency graph to **stdout** — redirect
          it to a file.

          \`\`\`bash
          ./${BIN_DOTNET} <path-to-.sln-or-.csproj-or-folder> > graph.json
          \`\`\`

          Example:

          \`\`\`bash
          ./${BIN_DOTNET} ./dotnet-ecommerce > output.json
          \`\`\`

          ## Verification

          \`\`\`bash
          sha256sum -c checksums.sha256
          \`\`\`
          EOF

      - name: Create archive
        working-directory: dist
        run: |
          chmod +x "${DIST_NAME}/bin/dotnet-analyzer${{ matrix.ext }}" 2>/dev/null || true
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "${DIST_NAME}.zip" "${DIST_NAME}"
            sha256sum "${DIST_NAME}.zip" > "${DIST_NAME}.sha256"
          else
            tar -czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
            sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.sha256"
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rel.outputs.dist_name }}
          path: |
            dist/${{ steps.rel.outputs.dist_name }}.${{ matrix.archive }}
            dist/${{ steps.rel.outputs.dist_name }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: |
            dist/${{ steps.rel.outputs.dist_name }}.${{ matrix.archive }}
            dist/${{ steps.rel.outputs.dist_name }}.sha256
          generate_release_notes: true
